services:
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    container_name: polister-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: polister_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: polister-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    image: node:20-bookworm
    container_name: polister-app
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "4000:3000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/polister_development?schema=public"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c "yarn install &&
               npx prisma generate &&
               npx prisma db push --accept-data-loss &&
               yarn user:create-admin &&
               yarn boards:import-csv -f tsukuba-boards.csv --if-empty &&
               yarn dev"
volumes:
  postgres_data:
  redis_data:
